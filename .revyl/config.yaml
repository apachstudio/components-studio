# Revyl CLI Configuration
# Generated by: revyl init
# Edit these settings or run: revyl config set <key> <value>
# Docs: https://docs.revyl.ai/cli/hot-reload

project:
    name: components-studio
build:
    system: Xcode
    command: xcodebuild -project ComponentsStudio.xcodeproj -scheme * -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
    output: build/Build/Products/Debug-iphonesimulator/*.app
    platforms:
        ios:
            app_id: 40687413-82fa-413a-90b5-63fdb92ebd59
            command: xcodebuild -project ComponentsStudio.xcodeproj -scheme 'ComponentsStudio' -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
            output: build/Build/Products/Debug-iphonesimulator/*.app
            scheme: ComponentsStudio
defaults:
    open_browser: true
    timeout: 1800
